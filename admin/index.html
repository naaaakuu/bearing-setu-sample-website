<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Bearingsetu Admin</title>
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the main content</a>
  <div id="app"></div>
  <div id="toasts" class="toast-area" aria-live="polite"></div>

  <dialog id="confirm" class="modal" aria-labelledby="confirm-title">
    <div class="modal-body" id="confirm-body"></div>
    <div class="toast-area" id="confirm-toasts" aria-live="polite"></div>
  </dialog>

  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
    <div class="drawer-body" id="drawer-body"></div>
    <div class="toast-area sticky" id="drawer-toasts" aria-live="polite"></div>
  </dialog>

  <dialog id="dialog" class="modal wide" aria-labelledby="dialog-title">
    <div class="modal-body" id="dialog-body"></div>
    <div class="toast-area" id="dialog-toasts" aria-live="polite"></div>
  </dialog>

  <noscript><p class="noscript">The admin panel needs JavaScript. Please turn it on in your browser.</p></noscript>
</body>
</html>
